  apiVersion: apiextensions.crossplane.io/v2
  kind: CompositeResourceDefinition
  metadata:
    name: postgresdatabases.rcarlsondevops.org
  spec:
    scope: Cluster
    group: rcarlsondevops.org
    names:
      kind: PostgresDatabase
      plural: postgresdatabases
    versions:
      - name: v1alpha1
        served: true
        referenceable: true
        schema:
          openAPIV3Schema:
            type: object
            properties:
              spec:
                type: object
                properties:
                  team:
                    type: string
                    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                    maxLength: 63
                  instances:
                    type: integer
                    minimum: 1
                    maximum: 3
                  size:
                    type: string
                    enum:
                      - small
                      - medium
                      - large
                    default: small
                required:
                  - team
                  - instances