  apiVersion: apiextensions.crossplane.io/v2
  kind: CompositeResourceDefinition
  metadata:
    name: postgresdatabases.rcarlsondevops.org
  spec:
    scope: Cluster
    group: rcarlsondevops.org
    names:
      kind: PostgresDatabase
      plural: postgresdatabases
    versions:
      - name: v1alpha1
        served: true
        referenceable: true
        schema:
          openAPIV3Schema:
            type: object
            properties:
              spec:
                type: object
                properties:
                  name:
                    type: string
                  instances:
                    type: integer
                  size:
                    type: string
                    enum:
                      - small
                      - medium
                      - large
                required:
                  - name
                  - instances
                  - size