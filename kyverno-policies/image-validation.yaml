apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: image-check
spec:
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE']
        resources: ['pods']
  matchImageReferences:
    - glob: ghcr.io/rcarlson-devops/*
  attestors:
    - name: cosign
      cosign:
        keyless:
          identities:
            - subjectRegExp: '^https://github.com/rcarlson-devops/.+/\.github/workflows/.+@refs/heads/main$'
              issuer: 'https://token.actions.githubusercontent.com'
  attestations:
    - name: sbom
      referrer:
        type: sbom/cyclone-dx
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.cosign])).all(e, e > 0)
      message: "Failed to verify the image signature"
    - expression: >-
        images.containers.map(image, verifyAttestationSignatures(image, attestations.sbom, [attestors.cosign])).all(e, e > 0)
      message: "Failed to verify signature on the image's SBOM attestation"