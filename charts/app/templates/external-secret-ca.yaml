apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-ca
  namespace: {{ include "app.fullname" . }}
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: {{ printf "tenants/%s/ca" (include "app.fullname" .) }}
        property: ca.crt
