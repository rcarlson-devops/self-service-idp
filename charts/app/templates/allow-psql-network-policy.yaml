apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-psql
spec:
  podSelector:
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{ .Release.Name }}-db"
      ports:
        - port: 5432
          protocol: "TCP"
