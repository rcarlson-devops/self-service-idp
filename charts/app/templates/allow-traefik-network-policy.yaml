apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: allow-traefik
spec:
    policyTypes: ["Ingress"]
    podSelector:
    ingress:
    - from:
        - namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: {{ .Values.service.targetPort }}
          protocol: "TCP"