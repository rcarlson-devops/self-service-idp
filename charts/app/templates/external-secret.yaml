apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: {{ include "app.name" . }}
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: dbname
      remoteRef:
        key: {{ printf "tenants/%s/db" (include "app.name" .) }}
        property: dbname
    - secretKey: username
      remoteRef:
        key: {{ printf "tenants/%s/db" (include "app.name" .) }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ printf "tenants/%s/db" (include "app.name" .) }}
        property: password
