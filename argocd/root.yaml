# App-of-apps root. This is the only Argo CD resource applied by hand
# (bootstrap/bootstrap.sh); everything under argocd/apps/ is discovered from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: self-service-idp-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rcarlson-devops/self-service-idp.git
    targetRevision: main
    path: argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
