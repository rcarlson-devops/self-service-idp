apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: self-service-idp-root
  namespace: argocd
spec:
  project: default
  source:
    # repoURL: https://github.com/rcarlson-devops/self-service-idp.git
    repoURL: git@github.com:rcarlson-devops/self-service-idp.git
    targetRevision: HEAD
    path: argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
