apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/rcarlson-platform/self-service-idp.git
    targetRevision: main
    path: crossplane/api
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # Required for large CRDs
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 1
        maxDuration: 3m