apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-backend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/rcarlson-devops/self-service-idp.git
    targetRevision: main
    path: vault-backend
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
#    syncOptions:
#      - SkipDryRunOnMissingResource=true
