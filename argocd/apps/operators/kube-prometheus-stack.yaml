# Deploys the app chart into each repo's environment
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 92.3.1
      path: charts/app
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/kube-prometheus-stack/dev-values.yaml
        parameters:
          - name: extraLabels.team
            value: dev-team-test
    - repoURL: https://github.com/rcarlson-devops/self-service-idp.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dev-env
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
