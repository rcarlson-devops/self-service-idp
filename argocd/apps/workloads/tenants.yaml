apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: self-service-idp-tenants
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/rcarlson-platform/self-service-idp.git
    targetRevision: main
    path: argocd/tenants
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
