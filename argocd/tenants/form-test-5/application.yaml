# Deploys the app chart into each repo's environment
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: form-test-5
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/rcarlson-devops/self-service-idp.git
      targetRevision: main
      path: charts/app
      helm:
        valueFiles:
          - $values/environments/dev/values-dev.yaml
    - repoURL: https://github.com/rcarlson-devops/form-test-5.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: form-test-5
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
