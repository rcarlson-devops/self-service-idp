# Deploys the app chart into each repo's environment
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-env-1
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/rcarlson-devops/self-service-idp.git
      targetRevision: main
      path: charts/app
      helm:
        valueFiles:
          - $values/environments/dev/values-dev.yaml
        parameters:
          - name: extraLabels.team
            value: dev-team-test
    - repoURL: https://github.com/rcarlson-devops/dev-env-1.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dev-env-1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
