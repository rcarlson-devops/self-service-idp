apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-dev
  namespace: argocd
spec:
  project: default
  source:
    # Replace with your actual GitOps repo URL
    repoURL: https://github.com/OWNER/REPO.git
    targetRevision: main
    path: hello-world-app/charts/hello-world
    helm:
      valueFiles:
        - environments/dev/values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-world-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
