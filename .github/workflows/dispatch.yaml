name: Deploy go-app-template and database
on:
  workflow_dispatch:
    inputs:
      team:
        description: "The team name responsible for the new service"
        required: true
        type: string
      service:
        description: "The name of the service being deployed"
        required: true
        type: string
      instances:
        description: "The number of database instances to deploy"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      size:
        description: "The size of the database to deploy"
        required: true
        type: choice
        options:
          - small
          - medium
          - large
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      INSTANCES: ${{ inputs.instances }}
      SERVICE: ${{ inputs.service }}
      SIZE: ${{ inputs.size }}
      TEAM: ${{ inputs.team }}
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.IDP_APP_CLIENT_ID }}
          private-key: ${{ secrets.IDP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Validate inputs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [[ ! "$SERVICE" =~ ^[a-z0-9]([a-z0-9-]{0,58}[a-z0-9])?$ ]]; then
            echo "Error: Service name must be alphanumeric and can include hyphens, but cannot start or end with a hyphen."
            echo "Error: Service name must be alphanumeric and can include hyphens, but cannot start or end with a hyphen." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ ! "$TEAM" =~ ^[a-z0-9]([a-z0-9-]{0,58}[a-z0-9])?$ ]]; then
            echo "Error: Team name must be alphanumeric and can include hyphens, but cannot start or end with a hyphen."
            echo "Error: Team name must be alphanumeric and can include hyphens, but cannot start or end with a hyphen." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ ! "$INSTANCES" =~ ^[1-3]$ ]]; then
            echo "Error: Instances must be 1, 2, or 3."
            echo "Error: Instances must be 1, 2, or 3." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ ! "$SIZE" =~ ^(small|medium|large)$ ]]; then
            echo "Error: Size must be small, medium, or large."
            echo "Error: Size must be small, medium, or large." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          case "$TEAM" in
            dev-team-?*) ;;
            *)
              echo "Error: team must start with dev-team-"
              echo "Error: team must start with dev-team-" >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
          case "$SERVICE" in
            argocd|default|kube-*|crossplane-system|cnpg-system|\
            cloudnativepg-operator|crossplane-functions|crossplane-operator|\
            database-api|self-service-idp-root|self-service-idp-tenants|\
            self-service-idp|go-app-template|hashicorp-vault|external-secrets-operator|\
            kyverno|kyverno-policies|*-db|vault|external-secrets|monitoring|grafana|prometheus|\
            kube-prometheus-stack|grafana-dashboards)
              echo "Error: '$SERVICE' is a reserved name. Choose another."
              echo "Error: '$SERVICE' is a reserved name. Choose another." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
          if gh repo view "rcarlson-platform/${SERVICE}" --json name > /dev/null 2>&1; then
            echo "rcarlson-platform/${SERVICE} already exists"
            echo "rcarlson-platform/${SERVICE} already exists" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if gh repo read-dir "argocd/tenants/${SERVICE}" --repo rcarlson-platform/self-service-idp --ref "${{ github.ref_name }}" &> /dev/null; then
            echo "Tenant ${SERVICE} already exists"
            echo "Tenant ${SERVICE} already exists" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Validate Step Succeeded" >> "$GITHUB_STEP_SUMMARY"
  deploy_new_repo:
    runs-on: ubuntu-latest
    needs: validate
    env:
      OWNER: ${{ github.repository_owner }}
      SERVICE: ${{ inputs.service }}
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.IDP_APP_CLIENT_ID }}
          private-key: ${{ secrets.IDP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: deploy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-Github-Api-Version: 2026-03-10" \
            "/repos/rcarlson-platform/go-app-template/generate" \
            -f name="${SERVICE}" \
            -f owner="${OWNER}" \
            -F private=false
          echo "rcarlson-platform/${SERVICE} created" >> "$GITHUB_STEP_SUMMARY"
  populate_tenants:
    runs-on: ubuntu-latest
    needs: deploy_new_repo
    concurrency:
      group: repo-group
    permissions:
      contents: write
    env:
      TEAM: ${{ inputs.team }}
      INSTANCES: ${{ inputs.instances }}
      SERVICE: ${{ inputs.service }}
      SIZE: ${{ inputs.size }}
      REF: ${{ github.ref_name }}
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.IDP_APP_CLIENT_ID }}
          private-key: ${{ secrets.IDP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Poll new repo for commit
        env:
          FILE_PATH: "environments/dev/values-dev.yaml"
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OUTPUT_PATH: "values-dev.yaml"
          POLL_INTERVAL: 10
          REPO: "rcarlson-platform/${{ inputs.service }}"
        timeout-minutes: 5
        run: |
          gh --version
          while true; do
            if gh repo read-file "$FILE_PATH" --repo "$REPO" --output "$OUTPUT_PATH" --clobber; then
              TARGET_VALUE=$(yq '.image.tag' "$OUTPUT_PATH")
              if [ "$TARGET_VALUE" != "null" ] && [ -n "$TARGET_VALUE" ]; then
                echo "Values pushed"
                rm "$OUTPUT_PATH"
                break
              fi
            fi
            echo "Values not pushed... Waiting $POLL_INTERVAL"
            sleep "$POLL_INTERVAL"
          done
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Create new tenants directory
        run: mkdir "./argocd/tenants/${SERVICE}"
      - name: Copy application.yaml.tmpl to tenants
        run: cp "./self-service/templates/application.yaml.tmpl" "./argocd/tenants/${SERVICE}/application.yaml"
      - name: Copy database.yaml.tmpl to tenants
        run: cp ./self-service/templates/database.yaml.tmpl "./argocd/tenants/${SERVICE}/database.yaml"
      - name: Replace placeholders in application.yaml
        run: |
          yq --version
          yq -i '(.metadata.name) = strenv(SERVICE)' "./argocd/tenants/${SERVICE}/application.yaml"
          yq -i '(.spec.sources[] | select(.ref == "values")).repoURL = "https://github.com/rcarlson-platform/" + strenv(SERVICE) + ".git"' "./argocd/tenants/${SERVICE}/application.yaml"
          yq -i '(.spec.destination.namespace) = strenv(SERVICE)' "./argocd/tenants/${SERVICE}/application.yaml"
          yq -i '(.spec.sources[] | select(.path == "charts/app")).helm.parameters += [{"name": "extraLabels.team", "value": strenv(TEAM)}]' "./argocd/tenants/${SERVICE}/application.yaml"
      - name: Replace placeholders in database.yaml
        run: |
          yq -i '(.metadata.name) = strenv(SERVICE)' "./argocd/tenants/${SERVICE}/database.yaml"
          yq -i '(.spec.team) = strenv(TEAM)' "./argocd/tenants/${SERVICE}/database.yaml"
          yq -i '(.spec.instances) = (strenv(INSTANCES) | tonumber)' "./argocd/tenants/${SERVICE}/database.yaml"
          yq -i '(.spec.size) = strenv(SIZE)' "./argocd/tenants/${SERVICE}/database.yaml"
      - name: Check for failed yq
        run: |
          for f in application database; do
            BLANKS=$(yq '.. | select(tag == "!!null") | path | join(".")' "./argocd/tenants/${SERVICE}/${f}.yaml")
            if [ -n "$BLANKS" ]; then
              echo "Unfilled fields in ${f}.yaml:"
              echo "$BLANKS"
              exit 1
            fi
          done
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "./argocd/tenants/${SERVICE}/application.yaml" "./argocd/tenants/${SERVICE}/database.yaml"
          git commit -m "Add application and database manifests for service ${SERVICE}"
          git pull --rebase
          git push origin "HEAD:${REF}"
          echo "**argocd/tenants/${SERVICE}/application.yaml and database.yaml committed and pushed" >> "$GITHUB_STEP_SUMMARY"
