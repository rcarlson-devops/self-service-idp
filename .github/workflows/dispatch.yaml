name: Deploy go-app-template and database
on:
  workflow_dispatch:
    inputs:
      team:
        description: 'The team name which will be used to name all resources deployed'
        required: true
        type: string
      instances:
        description: 'The number of database instances to deploy'
        required: true
        type: choice
        options:
          - '1'
          - '2'
          - '3'
      size:
        description: 'The size of the database to deploy'
        required: true
        type: choice
        options:
          - small
          - medium
          - large
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TEAM: ${{ inputs.team }}
      INSTANCES: ${{ inputs.instances }}
      SIZE: ${{ inputs.size }}
    steps:
      - name: Validate inputs
        run: |
          if [[ ! "$TEAM" =~ ^[a-z0-9]([a-z0-9-]{0,58}[a-z0-9])?$ ]]; then
            echo "Error: Team name must be alphanumeric and can include hyphens, but cannot start or end with a hyphen."
            echo "[!CAUTION] Error: Team name must be alphanumeric and can include hyphens, but cannot start or end with a hyphen." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          if [[ ! "$INSTANCES" =~ ^[1-3]$ ]]; then
            echo "Error: Instances must be 1, 2, or 3."
            echo "[!CAUTION] Error: Instances must be 1, 2, or 3." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          if [[ ! "$SIZE" =~ ^(small|medium|large)$ ]]; then
            echo "Error: Size must be small, medium, or large."
            echo "[!CAUTION] Error: Size must be small, medium, or large." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          case "$TEAM" in
            argocd|kube-system|default|crossplane-system|cnpg-system|\
            cloudnativepg-operator|crossplane-functions|crossplane-operator|\
            database-api|self-service-idp-root|self-service-idp-tenants|*-db)
              echo "Error: '$TEAM' is a reserved name. Choose another."
              echo "[!CAUTION] Error: '$TEAM' is a reserved name. Choose another." >> $GITHUB_STEP_SUMMARY
              exit 1
              ;;
          esac
          if gh repo view "rcarlson-devops/${TEAM}" --json name > /dev/null 2>&1; then
            echo "rcarlson-devops/${TEAM} already exists"
            echo "[!WARNING] rcarlson-devops/${TEAM} already exists" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "**Validate Step Succeeded**" >> $GITHUB_STEP_SUMMARY
  deploy_new_repo:
    runs-on: ubuntu-latest
    needs: validate
    env:
      GH_TOKEN: ${{ secrets.REPO_CREATOR_PAT }}
      TEAM: ${{ inputs.team }}
    steps:
      - name: deploy
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-Github-Api-Version: 2026-03-10" \
            "/repos/rcarlson-devops/go-app-template/generate" \
            -f name="${TEAM}" \
            -F private=false
          echo "**rcarlson-devops/${TEAM} created**" >> $GITHUB_STEP_SUMMARY
  populate_tenants:
    runs-on: ubuntu-latest
    needs: deploy_new_repo
    concurrency:
      group: repo-group
    permissions:
      contents: write
    env:
      TEAM: ${{ inputs.team }}
      INSTANCES: ${{ inputs.instances }}
      SIZE: ${{ inputs.size }}
    steps:
      - name: Poll new repo for commit
        env:
          FILE_PATH: "environments/dev/values-dev.yaml"
          GH_TOKEN: ${{ secrets.REPO_CREATOR_PAT }}
          OUTPUT_PATH: "values-dev.yaml"
          POLL_INTERVAL: 10
          REPO: "rcarlson-devops/${{ inputs.team }}"
        timeout-minutes: 5
        run: |
          gh --version
          while true; do
            if gh repo read-file "$FILE_PATH" --repo "$REPO" --output "$OUTPUT_PATH" --clobber; then
              TARGET_VALUE=$(yq '.image.tag' "$OUTPUT_PATH")
              if [ "$TARGET_VALUE" != "null" ] && [ -n "$TARGET_VALUE" ]; then
                echo "Values pushed"
                rm "$OUTPUT_PATH"
                break
              fi
            fi
            echo "Values not pushed... Waiting $POLL_INTERVAL"
            sleep "$POLL_INTERVAL"
          done          
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check if tenants folder already exists
        run: |
          if [ -d "./argocd/tenants/${TEAM}" ]; then
            echo "Tenant ${TEAM} already exists"
            exit 1
          fi
      - name: Create new tenants directory
        run: mkdir "./argocd/tenants/${TEAM}" 
      - name: Copy application.yaml.tmpl to tenants
        run: cp "./self-service/templates/application.yaml.tmpl" "./argocd/tenants/${TEAM}/application.yaml"
      - name: Copy database.yaml.tmpl to tenants
        run: cp ./self-service/templates/database.yaml.tmpl "./argocd/tenants/${TEAM}/database.yaml"
      - name: Replace placeholders in application.yaml
        run: |
          yq --version
          yq -i '(.metadata.name) = strenv(TEAM)' "./argocd/tenants/${TEAM}/application.yaml"
          yq -i '(.spec.sources[] | select(.ref == "values")).repoURL = "https://github.com/rcarlson-devops/" + strenv(TEAM) + ".git"' "./argocd/tenants/${TEAM}/application.yaml"
          yq -i '(.spec.destination.namespace) = strenv(TEAM)' "./argocd/tenants/${TEAM}/application.yaml"
      - name: Replace placeholders in database.yaml
        run: |
          yq -i '(.metadata.name) = strenv(TEAM)' "./argocd/tenants/${TEAM}/database.yaml"
          yq -i '(.spec.team) = strenv(TEAM)' "./argocd/tenants/${TEAM}/database.yaml"
          yq -i '(.spec.instances) = (strenv(INSTANCES) | tonumber)' "./argocd/tenants/${TEAM}/database.yaml"
          yq -i '(.spec.size) = strenv(SIZE)' "./argocd/tenants/${TEAM}/database.yaml"
      - name: Check for failed yq
        run: |
          for f in application database; do
            BLANKS=$(yq '.. | select(tag == "!!null") | path | join(".")' "./argocd/tenants/${TEAM}/${f}.yaml")
            if [ -n "$BLANKS" ]; then
              echo "Unfilled fields in ${f}.yaml:"
              echo "$BLANKS"
              exit 1
            fi
          done          
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "./argocd/tenants/${TEAM}/application.yaml" "./argocd/tenants/${TEAM}/database.yaml"
          git commit -m "Add application and database manifests for team ${TEAM}"
          git pull --rebase
          git push origin HEAD:main
          echo "**argocd/tenants/${TEAM}/application.yaml and database.yaml committed and pushed" >> $GITHUB_STEP_SUMMARY
