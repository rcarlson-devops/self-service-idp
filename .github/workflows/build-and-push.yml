name: build-and-push

# Builds and tests the app on every push to main, then publishes the image
# under two tags: an immutable sha-<short-sha> (what promote.yml retags
# later) and dev-latest (what the dev environment tracks, so dev updates
# automatically on every merge).

on:
  push:
    branches:
      - 'feature-*'
    paths:
      - "hello-world-app/app/**"
      - ".github/workflows/build-and-push.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hello-world

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: hello-world-app/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet and test
        run: |
          go vet ./...
          go test ./... -v

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract branch name
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hello-world
          tags: |
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: hello-world-app/app
          push: true
          build-args: |
            VERSION=sha-${{ steps.vars.outputs.sha_short }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.sha_short }}
            ${{ steps.meta.outputs.tags }}

      - name: Summary
        run: |
          echo "Pushed sha-${{ steps.vars.outputs.sha_short }} and ${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
