name: build-and-push

# CI half of the GitOps loop. On every push to main that touches app/ (or this
# file), it:
#   1. vets and tests the Go app,
#   2. builds the image and pushes it to GHCR as an immutable sha-<short-sha> tag,
#   3. commits that tag into environments/dev/values-dev.yaml.
# Argo CD watches that file and rolls the new image out to the dev cluster; CI
# never talks to the cluster. The bot commit only touches environments/, which
# is outside the path filter below, so it does not re-trigger this workflow.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-and-push.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet and test
        run: |
          go vet ./...
          go test ./... -v

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          build-args: |
            VERSION=sha-${{ steps.vars.outputs.sha_short }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.sha_short }}

      - name: Update values-dev.yaml
        run: |
          yq -i '.image.tag = "sha-${{ steps.vars.outputs.sha_short }}"' ../environments/dev/values-dev.yaml
          yq -i '.image.repository = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"' ../environments/dev/values-dev.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../environments/dev/values-dev.yaml
          git commit -m "Update values-dev.yaml with new image tag"
          git push origin HEAD:main
    
      - name: Summary
        run: |
          echo "Pushed sha-${{ steps.vars.outputs.sha_short }}" >> "$GITHUB_STEP_SUMMARY"
