# Deploys the hello-world chart to the dev environment.
# environments/dev/values-dev.yaml is updated by CI (build-and-push workflow)
# with the new image tag, which is what triggers a rollout.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rcarlson-devops/self-service-idp.git
    targetRevision: main
    path: charts/hello-world
    helm:
      valueFiles:
        - ../../environments/dev/values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-world-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
